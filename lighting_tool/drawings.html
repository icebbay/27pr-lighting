<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>27PR 照明施工图</title>
<link rel="stylesheet" href="pages.css?v=p11">
<style>
  .sets { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .sets button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .slide { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
  .slide img { width: 100%; display: block; cursor: zoom-in; }
  .slide .cap { color: var(--mute); margin-bottom: 4px; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; overflow: auto; z-index: 9; }
  #zoom img { display: block; width: 200%; max-width: none; }
  #zoom .close { position: fixed; right: 12px; top: 10px; z-index: 10; }
</style>
</head>
<body class="board-page">
<header>
  <h1>27PR 照明施工图 <small class="ver" id="ver"></small></h1>
  <nav class="nav"><a href="../index.html">总览</a><a href="index.html">照明</a><a href="power.html">插座 / 动力</a><a href="board.html">配电箱</a><a class="on" href="drawings.html">施工图</a></nav>
</header>
<main>
  <div class="box"><h2>选择方案和图纸</h2>
    <div class="sets" id="plans"></div>
    <div class="sets" id="sets"></div>
    <p id="plannote" class="muted"></p>
    <div id="dl"></div>
    <p class="muted">点图片放大，可以左右拖动看细节。</p></div>
  <div id="slides"></div>
</main>
<div id="zoom"><button class="close">关闭</button><img alt=""></div>
<script src="power_data.js?v=p14"></script>
<script>
(function () {
  const P = window.POWER_DEFAULT.plans;
  const SETS = [['GF-cn', '一层 · 国标', '一层', '国标', 7], ['GF-en', '一层 · 英式', '一层', '英式', 6], ['FF-cn', '二层 · 国标', '二层', '国标', 6], ['FF-en', '二层 · 英式', '二层', '英式', 5]];
  const $ = s => document.querySelector(s), zoom = $('#zoom');
  function pick() {   // #A-GF-cn
    const [p, f, st] = (location.hash || '').replace('#', '').split('-');
    const plan = P[(p || '').toUpperCase()] ? p.toUpperCase() : 'A';
    const set = SETS.find(x => x[0] === `${f}-${st}`) || SETS[0];
    return { plan, set };
  }
  function render() {
    const { plan, set } = pick(), pl = P[plan], file = `27PR_${set[2]}照明施工图_RevI-${plan}_${set[3]}`;
    $('#ver').textContent = 'Rev I · ' + pl.short;
    $('#plans').innerHTML = Object.keys(P).map(k => `<button data-go="${k}-${set[0]}" class="${k === plan ? 'on' : ''}">${P[k].name}</button>`).join('');
    $('#sets').innerHTML = SETS.map(x => `<button data-go="${plan}-${x[0]}" class="${x === set ? 'on' : ''}">${x[1]}</button>`).join('');
    $('#plannote').innerHTML = `照明 ${pl.lighting.length} 路：${pl.lighting.map(w => `<b>${w.id}</b> ${w.name.replace(/（.*|\+.*/, '')}`).join(' / ')}。两个方案的灯、开关、联动完全一样，只是照明回路分组不同（看系统图那一页最清楚）。`;
    $('#dl').innerHTML = `下载 PPT：<a href="drawings/${encodeURIComponent(file)}.pptx">${file}.pptx</a>`;
    $('#slides').innerHTML = Array.from({ length: set[4] }, (_, i) => { const src = `drawings/png/${encodeURIComponent(file)}/slide${String(i + 1).padStart(2, '0')}.png`;
      return `<div class="slide"><div class="cap">${pl.name} · ${set[1]} · 第 ${i + 1} / ${set[4]} 页</div><img loading="lazy" src="${src}" alt="${set[1]} 第 ${i + 1} 页"></div>`; }).join('');
    document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
    document.querySelectorAll('.slide img').forEach(im => im.onclick = () => { zoom.querySelector('img').src = im.src; zoom.style.display = 'block'; });
  }
  zoom.querySelector('.close').onclick = () => { zoom.style.display = 'none'; };
  window.addEventListener('hashchange', render); render();
})();
</script>
</body>
</html>
