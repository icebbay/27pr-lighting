<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>27PR 照明施工图</title>
<link rel="stylesheet" href="pages.css?v=p6">
<style>
  .sets { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .sets button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .slide { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
  .slide img { width: 100%; display: block; cursor: zoom-in; }
  .slide .cap { color: var(--mute); margin-bottom: 4px; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; overflow: auto; z-index: 9; }
  #zoom img { display: block; width: 200%; max-width: none; }
  #zoom .close { position: fixed; right: 12px; top: 10px; z-index: 10; }
</style>
</head>
<body class="board-page">
<header>
  <h1>27PR 照明施工图 <small class="ver" id="ver"></small></h1>
  <nav class="nav"><a href="../index.html">总览</a><a href="index.html">照明</a><a href="power.html">插座 / 动力</a><a href="board.html">配电箱</a><a class="on" href="drawings.html">施工图</a></nav>
</header>
<main>
  <div class="box"><h2>选择图纸</h2>
    <div class="sets" id="sets"></div>
    <div id="dl"></div>
    <p class="muted">按照明页（方案 A 的 4 路照明）出图。点图片放大，可以左右拖动看细节。</p></div>
  <div id="slides"></div>
</main>
<div id="zoom"><button class="close">关闭</button><img alt=""></div>
<script>
(function () {
  const REV = 'RevG';
  const SETS = [
    { id: 'GF-cn', name: '一层 · 国标', file: `27PR_一层照明施工图_${REV}_国标`, n: 7 },
    { id: 'GF-en', name: '一层 · 英式', file: `27PR_一层照明施工图_${REV}_英式`, n: 6 },
    { id: 'FF-cn', name: '二层 · 国标', file: `27PR_二层照明施工图_${REV}_国标`, n: 6 },
    { id: 'FF-en', name: '二层 · 英式', file: `27PR_二层照明施工图_${REV}_英式`, n: 5 },
  ];
  const $ = s => document.querySelector(s), zoom = $('#zoom');
  $('#ver').textContent = 'Rev G';
  const pick = () => SETS.find(s => s.id === location.hash.replace('#', '')) || SETS[0];
  function render() {
    const s = pick();
    $('#sets').innerHTML = SETS.map(x => `<button data-set="${x.id}" class="${x === s ? 'on' : ''}">${x.name}</button>`).join('');
    $('#dl').innerHTML = `下载 PPT：<a href="drawings/${encodeURIComponent(s.file)}.pptx">${s.file}.pptx</a>`;
    $('#slides').innerHTML = Array.from({ length: s.n }, (_, i) => { const src = `drawings/png/${encodeURIComponent(s.file)}/slide${String(i + 1).padStart(2, '0')}.png`;
      return `<div class="slide"><div class="cap">${s.name} · 第 ${i + 1} / ${s.n} 页</div><img loading="lazy" src="${src}" alt="${s.name} 第 ${i + 1} 页"></div>`; }).join('');
    document.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { location.hash = b.dataset.set; });
    document.querySelectorAll('.slide img').forEach(im => im.onclick = () => { zoom.querySelector('img').src = im.src; zoom.style.display = 'block'; });
  }
  zoom.querySelector('.close').onclick = () => { zoom.style.display = 'none'; };
  window.addEventListener('hashchange', render); render();
})();
</script>
</body>
</html>
